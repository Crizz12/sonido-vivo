<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario - Sonido Vivo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">🎸 Sonido Vivo</a>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <a href="carrito.html" class="carrito">🛒 Cart (<span id="contador-carrito">0</span>)</a>
    </nav>
  </header>

  <main>
    <section class="form-seccion">
      <h2>Registro de usuario</h2>
      <form id="form-registro" class="formulario" novalidate>

        <div class="campo">
          <label for="run">RUN *</label>
          <input type="text" id="run" name="run" maxlength="9" placeholder="123456785">
          <small class="ayuda">Sin puntos ni guion. Entre 7 y 9 caracteres.</small>
          <span class="error" id="error-run"></span>
        </div>

        <div class="campo">
          <label for="nombres">Nombre *</label>
          <input type="text" id="nombres" name="nombres" maxlength="50" autocomplete="given-name">
          <span class="error" id="error-nombres"></span>
        </div>

        <div class="campo">
          <label for="apellidos">Apellidos *</label>
          <input type="text" id="apellidos" name="apellidos" maxlength="100" autocomplete="family-name">
          <span class="error" id="error-apellidos"></span>
        </div>

        <div class="campo">
          <label for="correo-reg">Correo *</label>
          <input type="email" id="correo-reg" name="correo" maxlength="100" autocomplete="email">
          <small class="ayuda">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com</small>
          <span class="error" id="error-correo-reg"></span>
        </div>

        <div class="campo">
          <label for="fecha-nacimiento">Fecha de nacimiento (opcional)</label>
          <input type="date" id="fecha-nacimiento" name="fechaNacimiento">
          <span class="error" id="error-fecha-nacimiento"></span>
        </div>

        <div class="campo">
          <label for="region">Región *</label>
          <select id="region" name="region">
            <option value="">-- Seleccione la región --</option>
          </select>
          <span class="error" id="error-region"></span>
        </div>

        <div class="campo">
          <label for="comuna">Comuna *</label>
          <select id="comuna" name="comuna">
            <option value="">-- Seleccione la comuna --</option>
          </select>
          <span class="error" id="error-comuna"></span>
        </div>

        <div class="campo">
          <label for="direccion">Dirección *</label>
          <input type="text" id="direccion" name="direccion" maxlength="300" autocomplete="street-address">
          <span class="error" id="error-direccion"></span>
        </div>

        <div class="campo">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password" maxlength="10">
          <small class="ayuda">Entre 4 y 10 caracteres.</small>
          <span class="error" id="error-password"></span>
        </div>

        <div class="campo">
          <label for="password2">Confirmar contraseña *</label>
          <input type="password" id="password2" name="password2" maxlength="10">
          <span class="error" id="error-password2"></span>
        </div>

        <button type="submit" class="btn">Registrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Sonido Vivo - Viña del Mar, Región de Valparaíso</p>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/regiones.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
