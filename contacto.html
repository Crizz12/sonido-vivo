<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Sonido Vivo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">🎸 Sonido Vivo</a>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <a href="carrito.html" class="carrito">🛒 Cart (<span id="contador-carrito">0</span>)</a>
    </nav>
  </header>

  <main>
    <section class="form-seccion">
      <h2>Formulario de contacto</h2>
      <form id="form-contacto" class="formulario" novalidate>

        <div class="campo">
          <label for="nombre">Nombre completo *</label>
          <input type="text" id="nombre" name="nombre" maxlength="100" autocomplete="name">
          <span class="error" id="error-nombre"></span>
        </div>

        <div class="campo">
          <label for="correo">Correo *</label>
          <input type="email" id="correo" name="correo" maxlength="100" autocomplete="email">
          <small class="ayuda">Solo se aceptan correos @duoc.cl, @profesor.duoc.cl o @gmail.com</small>
          <span class="error" id="error-correo"></span>
        </div>

        <div class="campo">
          <label for="comentario">Comentario *</label>
          <textarea id="comentario" name="comentario" rows="5" maxlength="500"></textarea>
          <small class="ayuda"><span id="contador-caracteres">0</span>/500 caracteres</small>
          <span class="error" id="error-comentario"></span>
        </div>

        <button type="submit" class="btn">Enviar mensaje</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Sonido Vivo - Viña del Mar, Región de Valparaíso</p>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
